name: Auto-Deploy to Development

on:
  push:
    branches:
      - 'feature/**'
      - 'feat/**'
      - 'bugfix/**'
      - 'fix/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'

env:
  NODE_VERSION: '20'
  ENVIRONMENT: development

jobs:
  # CI validation for development
  ci-checks:
    name: CI Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint || true  # Don't fail on lint for dev

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

  # Build development version
  build-development:
    name: Build Development Version
    runs-on: ubuntu-latest
    needs: ci-checks
    outputs:
      version: ${{ steps.version.outputs.version }}
      
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Generate development version
        id: version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          DEV_VERSION="${PACKAGE_VERSION}-dev-${{ github.run_number }}"
          echo "version=$DEV_VERSION" >> $GITHUB_OUTPUT
          echo "Explorer development version: $DEV_VERSION"

      - name: Build with development configuration
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}
          VITE_ENVIRONMENT: development
          VITE_API_BASE_URL: https://dev-bridge.ottochain.ai
          VITE_GRAPHQL_URL: https://dev-gateway.ottochain.ai/graphql
          VITE_WEBSOCKET_URL: wss://dev-gateway.ottochain.ai/graphql
        run: pnpm build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push development image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag ghcr.io/ottobot-ai/ottochain-explorer:${{ steps.version.outputs.version }} \
            --tag ghcr.io/ottobot-ai/ottochain-explorer:dev-latest \
            --push \
            --build-arg VERSION=${{ steps.version.outputs.version }} \
            --build-arg ENVIRONMENT=development \
            .

      - name: Generate deployment manifest
        run: |
          cat > deployment-manifest.json << EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.event.inputs.branch || github.ref_name }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "environment": "development",
            "image": "ghcr.io/ottobot-ai/ottochain-explorer:${{ steps.version.outputs.version }}",
            "config": {
              "api_base_url": "https://dev-bridge.ottochain.ai",
              "graphql_url": "https://dev-gateway.ottochain.ai/graphql",
              "websocket_url": "wss://dev-gateway.ottochain.ai/graphql"
            }
          }
          EOF

      - name: Upload deployment manifest
        uses: actions/upload-artifact@v4
        with:
          name: dev-explorer-manifest-${{ github.run_number }}
          path: deployment-manifest.json
          retention-days: 7

  # Trigger explorer deployment
  trigger-explorer-deploy:
    name: Trigger Explorer Deployment
    runs-on: ubuntu-latest
    needs: [ci-checks, build-development]
    
    steps:
      - name: Trigger explorer deployment
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.OTTOCHAIN_DEPLOY_TOKEN }}
          repository: ottobot-ai/ottochain-deploy
          event-type: deploy-explorer-development
          client-payload: |
            {
              "source_repo": "ottochain-explorer",
              "branch": "${{ github.event.inputs.branch || github.ref_name }}",
              "version": "${{ needs.build-development.outputs.version }}",
              "commit_sha": "${{ github.sha }}",
              "manifest_artifact": "dev-explorer-manifest-${{ github.run_number }}",
              "run_id": "${{ github.run_id }}",
              "environment": "development"
            }

      - name: Development explorer deployment started
        run: |
          echo "🚀 Development explorer deployment triggered"
          echo "Version: ${{ needs.build-development.outputs.version }}"
          echo "Branch: ${{ github.event.inputs.branch || github.ref_name }}"
          echo ""
          echo "Explorer will be available at:"
          echo "- https://dev.ottochain.ai"
          echo ""
          echo "Connected to development APIs:"
          echo "- Bridge: https://dev-bridge.ottochain.ai"
          echo "- GraphQL: https://dev-gateway.ottochain.ai/graphql"
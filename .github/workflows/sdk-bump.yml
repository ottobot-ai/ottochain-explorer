name: SDK Version Bump

on:
  repository_dispatch:
    types: [sdk-bump]
  workflow_dispatch:
    inputs:
      version:
        description: 'SDK version (without v prefix, e.g., 1.3.0)'
        required: true
        type: string

jobs:
  bump:
    name: Bump @ottochain/sdk
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    outputs:
      pr-number: ${{ steps.create-pr.outputs.pull-request-number }}
      pr-created: ${{ steps.create-pr.outputs.pull-request-operation == 'created' || steps.create-pr.outputs.pull-request-operation == 'updated' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine version
        id: params
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            VERSION="${{ github.event.client_payload.version }}"
          else
            VERSION="${{ inputs.version }}"
          fi
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "Error: VERSION is empty — cannot bump SDK"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Bumping @ottochain/sdk to $VERSION"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Update SDK version
        run: |
          VERSION="${{ steps.params.outputs.version }}"
          found=0
          for field in dependencies devDependencies; do
            if jq -e ".$field[\"@ottochain/sdk\"]" package.json > /dev/null 2>&1; then
              tmpfile=$(mktemp)
              jq --arg v "$VERSION" ".${field}[\"@ottochain/sdk\"] = \$v" package.json > "$tmpfile" && mv "$tmpfile" package.json
              echo "Updated $field to $VERSION"
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "Error: @ottochain/sdk not found in dependencies or devDependencies — aborting"
            exit 1
          fi

      - name: Update lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.OTTOBOT_PAT }}
          commit-message: "chore(deps): bump @ottochain/sdk to v${{ steps.params.outputs.version }}"
          title: "chore(deps): bump @ottochain/sdk to v${{ steps.params.outputs.version }}"
          body: |
            Automated SDK version bump triggered by `@ottochain/sdk` release.

            ## Changes
            - `@ottochain/sdk` → `${{ steps.params.outputs.version }}`

            ---
            *Triggered by: ${{ github.event_name }}*
            *Auto-merge enabled: will merge when CI passes*
          branch: bump/sdk-${{ steps.params.outputs.version }}
          delete-branch: true
          labels: |
            dependencies
            automated

  auto-merge:
    name: Auto-merge when CI passes
    needs: bump
    if: needs.bump.outputs.pr-created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Wait for CI and merge
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.OTTOBOT_PAT }}
          script: |
            const prNumber = ${{ needs.bump.outputs.pr-number }};
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            console.log(`Waiting for CI on PR #${prNumber}...`);
            
            // Poll for CI completion (max 20 minutes - explorer CI is faster)
            const maxWait = 20 * 60 * 1000;
            const pollInterval = 30 * 1000;
            const startTime = Date.now();
            
            while (Date.now() - startTime < maxWait) {
              // Get PR status
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: prNumber
              });
              
              if (pr.merged) {
                console.log('PR already merged');
                return;
              }
              
              if (pr.state === 'closed') {
                console.log('PR was closed');
                return;
              }
              
              // Check combined status
              const { data: status } = await github.rest.repos.getCombinedStatusForRef({
                owner, repo, ref: pr.head.sha
              });
              
              // Also check check runs (GitHub Actions)
              const { data: checks } = await github.rest.checks.listForRef({
                owner, repo, ref: pr.head.sha
              });
              
              const pendingChecks = checks.check_runs.filter(c => 
                c.status !== 'completed' && c.name !== 'Auto-merge when CI passes'
              );
              const failedChecks = checks.check_runs.filter(c => 
                c.status === 'completed' && c.conclusion !== 'success' && c.conclusion !== 'skipped'
              );
              
              console.log(`Status: ${status.state}, Pending: ${pendingChecks.length}, Failed: ${failedChecks.length}`);
              
              if (failedChecks.length > 0) {
                console.log('CI failed, not merging');
                console.log('Failed checks:', failedChecks.map(c => c.name).join(', '));
                return;
              }
              
              if (pendingChecks.length === 0 && status.state !== 'pending') {
                // All checks complete and passing
                console.log('CI passed, merging...');
                try {
                  await github.rest.pulls.merge({
                    owner, repo, pull_number: prNumber,
                    merge_method: 'squash'
                  });
                  console.log('PR merged successfully');
                } catch (e) {
                  console.log('Merge failed:', e.message);
                }
                return;
              }
              
              // Wait before polling again
              await new Promise(r => setTimeout(r, pollInterval));
            }
            
            console.log('Timeout waiting for CI');
